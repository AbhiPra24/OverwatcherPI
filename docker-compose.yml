# OverwatcherPI — full stack compose
# See docs/docker.md for pre-flight and migration steps.
services:

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overwatcher-bot
    network_mode: host          # required: nmap ARP discovery + BlueZ D-Bus
    security_opt:
      - apparmor:unconfined
    cap_add:
      - NET_RAW
      - NET_ADMIN
    group_add:
      - "44"   # video group for /dev/vcio access by vcgencmd
      - "988"  # docker group for /var/run/docker.sock
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/dbus:/var/run/dbus  # BlueZ D-Bus passthrough (see docs/docker.md)
      - /usr/bin/vcgencmd:/usr/bin/vcgencmd:ro  # Pi throttling/temp queries
      - /lib/aarch64-linux-gnu/libvchiq_arm.so:/lib/aarch64-linux-gnu/libvchiq_arm.so:ro
      - /lib/aarch64-linux-gnu/libvcos.so:/lib/aarch64-linux-gnu/libvcos.so:ro
      - /proc/device-tree/model:/etc/pi-model:ro
      - /var/log/auth.log:/var/log/auth.log:ro  # SSH watcher
      - /var/run/docker.sock:/var/run/docker.sock:ro  # docker socket for container health checks
    devices:
      - /dev/vcio:/dev/vcio  # required by vcgencmd
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 5m
      timeout: 20s
      retries: 3
      start_period: 2m


